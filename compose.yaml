services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurolearn}
      POSTGRES_USER: ${POSTGRES_USER:-neurolearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neurolearn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurolearn} -d ${POSTGRES_DB:-neurolearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neurolearn-postgres-data:
