spring:
  application:
    name: neurolearn
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:neurolearn}
    username: ${POSTGRES_USER:neurolearn}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

neurolearn:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin-api-key: ${ADMIN_API_KEY:}
