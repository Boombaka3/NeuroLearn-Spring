spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

neurolearn:
  frontend-origin: ${FRONTEND_ORIGIN}
  admin-api-key: ${ADMIN_API_KEY}

logging:
  level:
    root: INFO
    com.boombaka.neurolearn: INFO
    org.hibernate.SQL: OFF
